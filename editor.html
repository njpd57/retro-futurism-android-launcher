<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor del mapa</title>
    <style>
      :root { --ph: #ffb000; --dim: #8a6200; --bg: #0a0700; --line: #3a2900; --bad: #ff5a3c; --warn: #ffd84a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ph); font: 14px/1.35 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      #app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
      #stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #000; }
      #view { position: relative; flex: 1; min-height: 0; }
      [hidden] { display: none !important; }
      #tabs { flex: none; display: flex; gap: 0; border-bottom: 1px solid var(--line); background: #0d0900; }
      #tabs button { border: 0; border-right: 1px solid var(--line); padding: 6px 16px; background: transparent; text-transform: uppercase; }
      #tabs button.on { background: var(--ph); color: var(--bg); }
      #tools-materials, #tools-prefabs { flex: none; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 6px 8px; background: rgba(10,7,0,.88); border-bottom: 1px solid var(--line); }
      #gl, #ov, #ov-prefabs { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #ov, #ov-prefabs { touch-action: none; user-select: none; }
      #ov-prefabs { z-index: 1; }
      .tabbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); }
      .stack { display: grid; gap: 6px; padding: 8px; }
      .listing { display: grid; gap: 2px; }
      .item { padding: 2px 6px; cursor: pointer; border: 1px solid transparent; display: flex; justify-content: space-between; gap: 8px; }
      .item:hover { border-color: var(--dim); }
      .item.on { background: var(--ph); color: var(--bg); }
      .item .dim { color: var(--dim); } .item.on .dim { color: var(--bg); }
      img.thumb { width: 100%; image-rendering: pixelated; border: 1px solid var(--line); }
      svg#ov-prefabs .axis { stroke-width: 4; stroke-linecap: round; cursor: pointer; } svg#ov-prefabs .tip { stroke: #fff; stroke-width: 2; cursor: pointer; }
      #tools { flex: none; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 6px 8px; background: rgba(10,7,0,.88); border-bottom: 1px solid var(--line); z-index: 2; }
      #tools label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; white-space: nowrap; }
      #hud { position: absolute; left: 8px; bottom: 6px; color: var(--dim); z-index: 2; pointer-events: none; white-space: pre; }
      #side { border-left: 1px solid var(--line); overflow: auto; background: var(--bg); }
      #file { padding: 8px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; position: sticky; top: 0; background: var(--bg); z-index: 3; }
      #file .bar { display: flex; flex-wrap: wrap; gap: 4px; }
      #panel details { border-bottom: 1px solid var(--line); }
      #panel summary { padding: 6px 8px; cursor: pointer; text-transform: uppercase; background: #140e00; }
      #panel .body { padding: 6px 8px 10px; display: grid; gap: 4px; }
      .row { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; }
      .row.pair { grid-template-columns: 24px 1fr 1fr auto; }
      .title { color: var(--bg); background: var(--ph); padding: 1px 6px; }
      .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
      input, select, button { font: inherit; color: var(--ph); background: #120d00; border: 1px solid var(--dim); padding: 2px 6px; min-width: 0; }
      input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ph); }
      input[type=range] { padding: 0; accent-color: var(--ph); }
      button { cursor: pointer; }
      button:hover, button:active { background: var(--ph); color: var(--bg); }
      button:disabled { opacity: .4; pointer-events: none; }
      button.danger { border-color: var(--bad); color: var(--bad); }
      button.danger:hover { background: var(--bad); color: var(--bg); }
      button.small { padding: 0 6px; }
      .bar { display: flex; gap: 6px; margin-top: 6px; }
      .bar.wrap { flex-wrap: wrap; }
      .issue { padding: 2px 4px; cursor: pointer; }
      .issue:hover { background: #1c1400; }
      .issue.error { color: var(--bad); }
      .issue.warn { color: var(--warn); }
      dialog { background: var(--bg); color: var(--ph); border: 1px solid var(--ph); max-width: 90vw; max-height: 85vh; }
      dialog pre { margin: 0; overflow: auto; max-height: 70vh; }
      dialog::backdrop { background: rgba(0,0,0,.7); }
      .add { color: #7dff7d; } .del { color: var(--bad); } .ctx { color: var(--dim); }
      #walk-hint { position: absolute; inset: 8px 8px auto 8px; text-align: center; background: rgba(10,7,0,.8); padding: 3px; z-index: 2; pointer-events: none; display: none; }

      /* the overlay */
      svg .g { stroke: #ffb000; stroke-opacity: .07; stroke-width: 1; }
      svg .g10 { stroke-opacity: .16; }
      svg .gl { fill: #ffb000; fill-opacity: .4; font-size: 10px; }
      svg .room { fill: #ffb000; fill-opacity: 0; stroke: #ffb000; stroke-width: 1.5; stroke-opacity: .85; cursor: default; }
      svg .room.corr { stroke-opacity: .5; stroke-dasharray: 6 3; }
      svg .room:hover { fill-opacity: .04; }
      svg .room.sel { fill-opacity: .07; stroke-width: 2.5; stroke-opacity: 1; }
      svg .nm { fill: #ffb000; fill-opacity: .55; font-size: 12px; text-anchor: middle; pointer-events: none; }
      svg .prop { fill: #ffb000; fill-opacity: .12; stroke: #ffb000; stroke-width: 1; cursor: move; }
      svg .prop.soft { stroke-dasharray: 3 2; fill-opacity: .05; }
      svg .prop.glow { fill-opacity: .3; }
      svg .prop:hover { fill-opacity: .3; }
      svg .prop.sel { stroke-width: 2.5; fill-opacity: .45; }
      svg .scr line, svg .por line { stroke: #7de0ff; stroke-width: 3; stroke-linecap: round; }
      svg .scr line:last-child { stroke-width: 1.5; }
      svg .por line { stroke: #ffffff; stroke-opacity: .9; stroke-width: 4; }
      svg .por.bad line { stroke: var(--bad); }
      svg .scr line:not(.hit), svg .por line:not(.hit), svg .pt line { pointer-events: none; }
      svg .hit { stroke: transparent !important; stroke-width: 16px !important; cursor: move; }
      svg .sel line:not(.hit) { stroke-width: 6px; stroke: #fff; }
      svg .lamp { fill: #ffb000; fill-opacity: .5; }
      svg .lt { fill: #fff3a0; fill-opacity: .6; stroke: #fff3a0; cursor: move; }
      svg .lt.sel { stroke-width: 3; }
      svg .pt { fill: none; stroke: #7dff7d; stroke-width: 1.5; cursor: move; }
      svg .pt.sel { stroke-width: 3; stroke: #fff; }
      svg g.pt circle { fill: #0a0700; stroke: inherit; cursor: move; }
      svg .h { fill: #0a0700; stroke: #fff; stroke-width: 2; cursor: crosshair; }
      svg .h.mid { fill: #fff; fill-opacity: .25; r: 4; }
      svg .h.rot { fill: #ffb000; }
      svg .mk circle { fill: #0a0700; stroke: var(--warn); stroke-width: 2; }
      svg .mk.error circle { stroke: var(--bad); }
      svg .mk text { fill: var(--warn); text-anchor: middle; font-weight: bold; font-size: 13px; }
      svg .mk.error text { fill: var(--bad); }
      svg .mk { pointer-events: all; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="tabs"></div>
        <div id="tools"></div>
        <div id="tools-materials" class="tools" hidden></div>
        <div id="tools-prefabs" class="tools" hidden></div>
        <div id="view">
          <canvas id="gl"></canvas>
          <svg id="ov"></svg>
          <svg id="ov-prefabs" style="display:none"></svg>
          <div id="hud"></div>
          <div id="walk-hint">WASD: MOVER · ARRASTRA CON EL RATÓN O FLECHAS: MIRAR · DOBLE CLIC: CAPTURAR EL RATÓN · SHIFT: DESPACIO · ESC O TAB: VOLVER AL PLANO</div>
        </div>
      </div>
      <aside id="side">
        <div id="side-map">
          <div id="file"></div>
          <div id="panel"></div>
        </div>
        <div id="side-materials" hidden></div>
        <div id="side-prefabs" hidden></div>
      </aside>
    </div>
    <dialog id="diff"><pre></pre><form method="dialog"><button>CERRAR</button></form></dialog>
    <script type="module" src="/src/editor/main.ts"></script>
  </body>
</html>
